[project]
name = "mapgen"
version = "0.1.0"
description = "Map generation pipeline for Roadman Simulator: Somero-City"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyproj>=3.6",
    "pyyaml>=6.0",
]

[project.scripts]
mapgen = "mapgen.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapgen"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
