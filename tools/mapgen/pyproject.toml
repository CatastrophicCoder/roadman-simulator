[project]
name = "mapgen"
version = "0.1.0"
description = "Map generation pipeline for Roadman Simulator: Somero-City"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "laspy>=2.7.0",
    "lazrs>=0.8.2",
    "mapbox-earcut>=2.1.0",
    "numpy>=2.5.4",
    "pydantic>=2.7",
    "pyproj>=3.6",
    "pyyaml>=6.0",
    "rasterio>=1.5.2",
    "shapely>=2.2.0",
    "trimesh>=5.2.0",
]

[project.scripts]
mapgen = "mapgen.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapgen"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "rawdata: builds from the downloaded raw data in data/raw/ (skipped when it is missing)",
]
