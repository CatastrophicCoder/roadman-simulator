# Frozen map config for tests. Do not change it when maps/somero/map.yaml changes:
# test reference values (origin, projected bbox, TM35 sheets) depend on it.
# The area is the first Somero bbox; the id is different on purpose, so map-specific
# code that assumes "somero" fails the tests.

id: testtown
display_name: "Test Town"

bbox_wgs84:
  lat_min: 60.62
  lat_max: 60.64
  lon_min: 23.50
  lon_max: 23.54

crs: "EPSG:3067"

# The bbox centre 60.63 N, 23.52 E in EPSG:3067 (309656.76, 6726616.03), rounded.
origin:
  x: 309657
  y: 6726616

tile_size_m: 256

test_area:
  size_m: 300

style_preset: default

sources:
  osm:
    adapter: osm_overpass
    enabled: true
    options: {}

  mml_dem_2m:
    adapter: mml_dem_2m
    enabled: true
    options:
      file_format: TIFF

  mml_orthophoto:
    adapter: mml_orthophoto
    enabled: true
    options:
      year: 9999
      file_format: JPEG2000
      sheet_scale: 10000
      map_sheet_input: list

  mml_buildings_3d:
    adapter: mml_buildings_3d
    enabled: false
    options:
      sheet_scale: 10000
      map_sheet_input: list

  mml_topographic:
    adapter: mml_topographic
    enabled: false
    options:
      theme: maastotietokanta_kaikki
      file_format: GPKG

# Roads: deliberately different from maps/somero/map.yaml, so a test can tell that the
# pipeline uses this map's values and nothing hard-coded.
roads:
  surface_offset_m: 0.08
  default_speed_kmh: 60
  bridge:
    deck_thickness_m: 0.7
    railing_height_m: 1.2
    railing_width_m: 0.3
    min_clearance_m: 2.5
    ramp_length_m: 3.5
    rim_search_m: 25.0
    walk_rim_search_m: 45.0
    max_ramp_grade: 0.1
    dip_report_m: 1.5
    ground_above_deck_warning_m: 0.08
    lidar_fit:
      classes: [2, 11]
      bin_m: 1.5
      band_m: 0.25
      min_bins: 5
      min_inlier_share: 0.7
    inferred_waterways: [river, stream]
  classes:
    primary:     {width_m: 9.0, lanes: 3, drivable: true,  walkable: true, speed_kmh: 70}
    residential: {width_m: 6.5, lanes: 1, drivable: true,  walkable: true}
    service:     {width_m: 4.5, lanes: 1, drivable: true,  walkable: false, speed_kmh: 25}
    driveway:    {width_m: 3.5, lanes: 1, drivable: true,  walkable: false, speed_kmh: 15}
    cycleway:    {width_m: 2.5, lanes: 1, drivable: false, walkable: true}
    footway:     {width_m: 1.5, lanes: 1, drivable: false, walkable: true}
