# Map config for Somero-City. Schema: tools/mapgen/src/mapgen/config.py (MapConfig).
#
# The bbox is a first guess at Somero centre; adjust it after checking it in QGIS.
# When the bbox changes, recompute the origin and paste the result below:
#   uv run --project tools/mapgen mapgen origin somero

id: somero
display_name: "Somero-City"

bbox_wgs84:
  lat_min: 60.62
  lat_max: 60.64
  lon_min: 23.50
  lon_max: 23.54

crs: "EPSG:3067"

# Local origin in metres in the map CRS (ADR 0003): the bbox centre 60.63 N, 23.52 E
# projected to EPSG:3067 with pyproj (always_xy) and rounded to the metre
# (309656.76, 6726616.03 before rounding).
origin:
  x: 309657
  y: 6726616

tile_size_m: 256

# Fixed small area for fast tests: a square of this size centred on the origin.
test_area:
  size_m: 300

style_preset: default  # placeholder until style presets exist

# Each source names an adapter (tools/mapgen/src/mapgen/sources/registry.py).
# `options` are checked by that adapter. MML sources need MML_API_KEY in the
# environment, or they print the manual download steps instead.
sources:
  osm:
    adapter: osm_overpass
    enabled: true
    options: {}

  mml_dem_2m:
    adapter: mml_dem_2m
    enabled: true
    options:
      file_format: TIFF

  mml_orthophoto:
    adapter: mml_orthophoto
    enabled: true
    debug_only: true        # debug view only (ADR 0009); skipped by download/build --release
    options:
      year: 9999            # MML: 9999 = latest year, 0 = all years
      file_format: JPEG2000
      sheet_scale: 10000    # MML process description: 1:10 000 sheets, e.g. L2332H
      map_sheet_input: list # MML: array of up to 100 sheets per job
      debug_texture_m_per_px: 0.5  # build: debug/orthophoto/ tile textures, 0.5-1.0 m/px

  mml_lidar:
    adapter: mml_lidar      # laser scanning data 0,5 p only (ADR 0005); building heights
    enabled: true
    options:
      sheet_scale: 5000     # MML product description: 3 x 3 km TM35 1:5 000 sheets
      map_sheet_input: list # MML: array of up to 100 sheets per job
      dataset: Uusin        # dataSetInput: Uusin = latest scan, or 05p_2008-2019, 05p_2020-
      file_format: LAZ
      inner_buffers_m: [1.0, 0.5, 0.0]  # footprint shrink ladder; first with min_points wins
      min_points: 5         # fewer points at every buffer: no lidar height (few_points)
      tree_spread_m: 8.0    # p90 - p10 above this: single returns only (else tree_cover)
      min_height_m: 1.0     # median roof minus base below this: rejected (too_low)
      max_height_m: 40.0    # above this: rejected (too_high)

  mml_buildings_3d:
    adapter: mml_buildings_3d
    enabled: false          # check MML's coverage map for Somero first
    options:
      sheet_scale: 10000    # TODO-verify
      map_sheet_input: list # TODO-verify

  mml_topographic:
    adapter: mml_topographic
    enabled: true
    options:
      theme: maastotietokanta_kaikki
      file_format: GPKG

# Road defaults (Finnish practice; tweakable). Spec: docs/specs/roads-and-road-graph.md.
# OSM tags (maxspeed, lanes, width, oneway, access) always win over these defaults.
roads:
  surface_offset_m: 0.05     # road surface height above the terrain mesh
  default_speed_kmh: 50      # built-up area; used by drivable classes without their own speed_kmh
  bridge:
    deck_thickness_m: 0.5
    railing_height_m: 1.0
    railing_width_m: 0.2
    min_clearance_m: 1.0     # deck underside above terrain; below this: warning in the report
    ramp_length_m: 5.0       # road-side ramp at each deck end, from terrain + offset to the deck-end height
    walk_rim_search_m: 60.0  # walk-only decks: search this far for the deck end, across junctions
    max_ramp_grade: 0.08     # walk-only deck end meeting no path: a ramp at most this steep along it
    rim_search_m: 30.0       # how far along the road deck ends (rims) and dips are searched
    dip_report_m: 1.0        # a crossing road without a bridge that dips more than this: listed in the report
    ground_above_deck_warning_m: 0.05  # ground this far above a deck's surface: build warning
    lidar_fit:               # deck heights from the point cloud; the geometric rim line is the fallback
      classes: [2]           # MML 0.5 p classifies deck surfaces as ground (class 2)
      bin_m: 2.0             # top point per bin along the span
      band_m: 0.3            # a bin agrees with the line within this
      min_bins: 4
      min_inlier_share: 0.6  # lowest measured on Somero's tagged bridges: 6 of 10 bins
    inferred_waterways: [river, stream, canal, ditch, drain, flowline]  # crossing these without a bridge tag: inferred bridge
  classes:
    primary:       {width_m: 8.0, lanes: 2, drivable: true,  walkable: false}
    secondary:     {width_m: 7.5, lanes: 2, drivable: true,  walkable: false}
    tertiary:      {width_m: 7.0, lanes: 2, drivable: true,  walkable: false}
    unclassified:  {width_m: 6.0, lanes: 2, drivable: true,  walkable: true}
    residential:   {width_m: 5.5, lanes: 2, drivable: true,  walkable: true, speed_kmh: 40}
    living_street: {width_m: 5.0, lanes: 1, drivable: true,  walkable: true, speed_kmh: 20}
    service:       {width_m: 4.0, lanes: 1, drivable: true,  walkable: true, speed_kmh: 20}
    driveway:      {width_m: 3.0, lanes: 1, drivable: true,  walkable: true, speed_kmh: 20}
    parking_aisle: {width_m: 5.0, lanes: 1, drivable: true,  walkable: true, speed_kmh: 20}
    track:         {width_m: 3.0, lanes: 1, drivable: true,  walkable: true}
    cycleway:      {width_m: 3.0, lanes: 1, drivable: false, walkable: true}  # combined cycle and foot path
    footway:       {width_m: 2.0, lanes: 1, drivable: false, walkable: true}
    path:          {width_m: 2.0, lanes: 1, drivable: false, walkable: true}
    pedestrian:    {width_m: 5.0, lanes: 1, drivable: false, walkable: true}

